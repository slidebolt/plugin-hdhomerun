name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o "dist/plugin-hdhomerun_${GOOS}_${GOARCH}" ./cmd/plugin-hdhomerun
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/plugin-hdhomerun_${{ matrix.goos }}_${{ matrix.goarch }}
